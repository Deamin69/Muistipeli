<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muistipeli</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <h1>Muistipeli</h1>

    <div id="game-controls">
        <label for="card-select">Valitse korttien määrä </label>
        <select id="card-select">
            <option value="4">4</option>
            <option value="8">8</option>
            <option value="16">16</option>
            <option value="20">20</option>
            <option value="24">24</option>
        </select>
        <button id="restart-btn">Aloita peli</button>
    </div>

    <div class="game-info">
        <span>Aika: <strong id="timer">0</strong></span>
        <span style="margin: 0 10px;">|</span>
        <span>Siirrot: <strong id="moves">0</strong></span>
    </div>

    <!-- Voittoruutu -->
    <div id="win-modal" class="modal hidden">
        <div class="modal-content">
            <h2>🎊 Hyvä sinä! 🎊</h2>
            <p>Löysit kaikki korttiparit 😁👍</p>
            <p>Aika: <strong id="final-time">0</strong> s</p>
            <p>Siirrot: <strong id="final-moves">0</strong></p>
            <button id="restart-modal-btn">Pelaa uudelleen</button>
        </div>
    </div>


    <div id="game-board"></div>
    <script type="module" src="./js/game.js"></script>
</body>

</html>
