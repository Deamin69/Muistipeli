<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muistipeli</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <h1>Muistipeli</h1>

    <div id="game-controls">
        <label for="card-select">Valitse korttien määrä </label>
        <select id="card-select">
            <option value="4">4</option>
            <option value="8">8</option>
            <option value="16">16</option>
            <option value="20">20</option>
        </select>
        <button id="restart-btn">Aloita peli</button>
    </div>

    <p id="timer-display">Aika: <span id="timer">0</span> s</p>


    <div id="game-board"></div>
    <script type="module" src="./js/game.js"></script>
</body>

</html>
